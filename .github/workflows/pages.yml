# Builds the web version and publishes it to GitHub Pages: https://hughesdo.github.io/Sizzle_FX/
# The web build has no Python server (VITE_HOSTED=1): projects save as .json, server render is off.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RVM is served from the site (its GitHub release download has no CORS headers).
      # SAM 2 (155 MB) loads straight from Hugging Face instead, which does.
      - name: Fetch the RVM person-mask model
        run: |
          mkdir -p public/models
          curl -fsSL -o public/models/rvm_mobilenetv3_fp32.onnx \
            https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
      - run: npm run build
        env:
          SFX_BASE: /Sizzle_FX/
          VITE_HOSTED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
